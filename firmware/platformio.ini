; PlatformIO project for the IoT hub ESP32 nodes.
;
; Two build environments share the same source file; each one selects the node
; type (and its node ID) with a -D build flag:
;
;   pio run -e sensor   -t upload     ; DHT22 sensor node  -> NODE_ID "node1"
;   pio run -e actuator -t upload     ; LED actuator node  -> NODE_ID "node2"
;
; Arduino IDE users: see README.md, you select the node type with a #define instead.

[platformio]
default_envs = sensor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:sensor]
build_flags =
    -D NODE_SENSOR
    -D NODE_ID=\"node1\"

[env:actuator]
build_flags =
    -D NODE_ACTUATOR
    -D NODE_ID=\"node2\"
